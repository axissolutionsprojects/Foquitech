<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="t d">
<title id="t">FOQUI — Produção02</title><desc id="d">Tela vertical de tablet com quatro cartões: Receitas, Calendário, Estoque e Compras. Receitas está selecionado em rosa.</desc>
