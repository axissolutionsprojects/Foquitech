<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">Foqui — Lista Receita</title>
  <desc id="desc">Interface vertical de tablet para seleção de receitas. Os doze nomes aparecem em ordem alfabética, em três colunas. Frango Grelhado está selecionado em rosa.</desc>
  <defs>
    <linearGradient id="outerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004b39"/>
      <stop offset="1" stop-color="#00634a"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#004d3a"/>
      <stop offset="1" stop-color="#003c2e"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004a38"/>
      <stop offset="1" stop-color="#003d30"/>
    </linearGradient>
    <linearGradient id="selectedBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9bad"/>
      <stop offset="1" stop-color="#f78ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1536" fill="url(#outerBg)"/>
  <ellipse cx="512" cy="1470" rx="430" ry="32" fill="#001d17" opacity=".35" filter="url(#shadow)"/>

  <!-- Moldura do tablet -->
  <rect x="49" y="66" width="926" height="1404" rx="64" fill="#050809" stroke="#777b7c" stroke-width="5"/>
  <rect x="96" y="114" width="832" height="1312" rx="22" fill="url(#screenBg)"/>
  <circle cx="511" cy="94" r="8" fill="#242b2d"/>
  <circle cx="511" cy="94" r="3.5" fill="#17617a"/>
  <circle cx="571" cy="94" r="7" fill="#333638"/>

  <!-- Cabeçalho -->
  <circle cx="153" cy="190" r="34" fill="#08735a" opacity=".78"/>
  <path d="M164 190h-22m0 0 10-10m-10 10 10 10" fill="none" stroke="#fff7e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="198" fill="#b8d8c9" font-family="Arial, sans-serif" font-size="21">Voltar</text>
  <rect x="612" y="153" width="298" height="67" rx="34" fill="none" stroke="#00765a" stroke-width="2"/>
  <text x="761" y="194" fill="#fff7e9" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">sexta-feira, 30 de outubro</text>

  <text x="128" y="305" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="bold">Receitas</text>
  <text x="130" y="349" fill="#c2d9ca" font-family="Arial, sans-serif" font-size="25">Escolha uma receita para visualizar.</text>

  <!-- Grade de receitas: 3 colunas, ordem alfabética -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" text-anchor="middle">
    <!-- Linha 1 -->
    <rect x="117" y="391" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="243.5" y="500" fill="#fff8ed"><tspan x="243.5">Cogumelo</tspan><tspan x="243.5" dy="31">Refogado</tspan></text>

    <rect x="388" y="391" width="253" height="208" rx="23" fill="url(#selectedBg)" stroke="#ff9bad" stroke-width="1.5"/>
    <text x="514.5" y="484" fill="#004632"><tspan x="514.5">Frango</tspan><tspan x="514.5" dy="31">Grelhado</tspan></text>

    <rect x="659" y="391" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="785.5" y="484" fill="#fff8ed"><tspan x="785.5">Maionese</tspan><tspan x="785.5" dy="31">de Alho</tspan></text>

    <!-- Linha 2 -->
    <rect x="117" y="619" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="243.5" y="712" fill="#fff8ed"><tspan x="243.5">Maionese</tspan><tspan x="243.5" dy="31">de Bacon</tspan></text>

    <rect x="388" y="619" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="514.5" y="712" fill="#fff8ed"><tspan x="514.5">Maionese de</tspan><tspan x="514.5" dy="31">Limão Siciliano</tspan></text>

    <rect x="659" y="619" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="785.5" y="712" fill="#fff8ed"><tspan x="785.5">Maionese</tspan><tspan x="785.5" dy="31">de Pesto</tspan></text>

    <!-- Linha 3 -->
    <rect x="117" y="847" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="243.5" y="940" fill="#fff8ed"><tspan x="243.5">Maionese de</tspan><tspan x="243.5" dy="31">Tomate Seco</tspan></text>

    <rect x="388" y="847" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="514.5" y="964" fill="#fff8ed">Mignon</text>

    <rect x="659" y="847" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="785.5" y="940" fill="#fff8ed"><tspan x="785.5">Molho</tspan><tspan x="785.5" dy="31">de Alho</tspan></text>

    <!-- Linha 4 -->
    <rect x="117" y="1075" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="243.5" y="1168" fill="#fff8ed"><tspan x="243.5">Molho</tspan><tspan x="243.5" dy="31">Shoyu</tspan></text>

    <rect x="388" y="1075" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="514.5" y="1168" fill="#fff8ed"><tspan x="514.5">Pão de</tspan><tspan x="514.5" dy="31">Queijo</tspan></text>

    <rect x="659" y="1075" width="253" height="208" rx="23" fill="url(#cardBg)" stroke="#08765a" stroke-width="1.5"/>
    <text x="785.5" y="1168" fill="#fff8ed"><tspan x="785.5">Pernil</tspan><tspan x="785.5" dy="31">Desfiado</tspan></text>
  </g>
</svg>
