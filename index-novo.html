:root{
  /* Paleta oficial Foqui */
  --foqui-verde:#05594c;
  --foqui-rosa:#f3a0b2;
  --foqui-creme:#ffe8c7;
  --foqui-areia:#ebd1a4;
  --foqui-grafite:#272526;

  /* Derivados para a interface (verde escurecido da marca) */
  --bg-1:#024536;
  --bg-2:#01342a;
  --card-verde-1:rgba(5,89,76,.30);
  --card-verde-2:rgba(1,40,32,.35);
  --card-borda:rgba(26,138,104,.45);
  --icone-verde:#05594c;
  --seta-verde:#0f5a45;
  --card-rosa-1:rgba(243,160,178,.68);
  --card-rosa-2:rgba(230,140,160,.64);
  --card-rosa-borda:#ef8aa1;
  --icone-rosa:rgba(255,214,222,.28);
  --texto-sec-verde:rgba(255,236,206,.78);
  --texto-sec-rosa:rgba(255,232,220,.86);

  /* Escala: a tela de referência tem 832 × 1309 */
  --s:min(calc(100vw / 832), calc(100dvh / 1309));
}
@supports not (height:100dvh){ :root{ --s:min(calc(100vw / 832), calc(100vh / 1309)); } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, var(--bg-1) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, #01382b 100%);
  background-color:var(--bg-2);
  color:var(--foqui-creme);
  font-family:'Foqui Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.tela{
  position:relative;
  width:calc(var(--s) * 832);
  height:calc(var(--s) * 1309);
  margin:0 auto;
  top:50%;
  transform:translateY(-50%);
}

/* Cabeçalho */
.logo{
  position:absolute;
  left:calc(var(--s) * 34);
  top:calc(var(--s) * 28);
  width:calc(var(--s) * 116);
  height:auto;
  filter:drop-shadow(0 calc(var(--s)*6) calc(var(--s)*14) rgba(0,0,0,.25));
}
.data{
  position:absolute;
  right:calc(var(--s) * 25);
  top:calc(var(--s) * 48);
  height:calc(var(--s) * 64);
  padding:0 calc(var(--s) * 30);
  display:flex;align-items:center;
  border:calc(var(--s) * 2) solid rgba(10,120,92,.75);
  border-radius:999px;
  background:rgba(1,52,42,.35);
  font-size:calc(var(--s) * 20);
  font-weight:400;
  letter-spacing:.01em;
  color:var(--foqui-creme);
  white-space:nowrap;
}

/* Cards */
.card{
  position:absolute;
  left:calc(var(--s) * 121);
  width:calc(var(--s) * 594);
  height:calc(var(--s) * 458);
  border-radius:calc(var(--s) * 44);
  text-decoration:none;
  color:inherit;
  display:block;
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s ease, filter .18s ease;
  overflow:hidden;
}
.card:active{transform:scale(.985);filter:brightness(1.05);}
.card--producao{
  top:calc(var(--s) * 242);
  background:linear-gradient(160deg, var(--card-verde-1) 0%, var(--card-verde-2) 100%);
  border:calc(var(--s) * 2) solid var(--card-borda);
  box-shadow:
    inset 0 calc(var(--s)*1) 0 rgba(255,232,199,.05),
    0 calc(var(--s)*18) calc(var(--s)*40) rgba(0,0,0,.22);
}
.card--finalizacao{
  top:calc(var(--s) * 730);
  background:linear-gradient(115deg, var(--card-rosa-1) 0%, var(--card-rosa-2) 100%);
  border:calc(var(--s) * 2.5) solid var(--card-rosa-borda);
  box-shadow:0 calc(var(--s)*18) calc(var(--s)*40) rgba(0,0,0,.25);
}
.card--finalizacao::before{
  /* leve escurecimento para o rosa assentar sobre o verde, como na referência */
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(70,35,45,.04), rgba(50,25,32,.10));
  pointer-events:none;
}

.icone{
  position:absolute;
  left:50%;
  top:calc(var(--s) * 42);
  transform:translateX(-50%);
  width:calc(var(--s) * 214);
  height:calc(var(--s) * 208);
  border-radius:calc(var(--s) * 42);
  display:flex;align-items:center;justify-content:center;
}
.card--producao .icone{
  background:linear-gradient(160deg, #06604f 0%, #04503f 100%);
  box-shadow:0 calc(var(--s)*10) calc(var(--s)*24) rgba(0,0,0,.18);
}
.card--finalizacao .icone{
  background:var(--icone-rosa);
  box-shadow:0 calc(var(--s)*10) calc(var(--s)*24) rgba(80,30,40,.15);
}
.icone svg{
  width:calc(var(--s) * 140);
  height:calc(var(--s) * 140);
  color:var(--foqui-creme);
}

.seta{
  position:absolute;
  right:calc(var(--s) * 27);
  top:calc(var(--s) * 176);
  width:calc(var(--s) * 78);
  height:calc(var(--s) * 78);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.seta svg{width:calc(var(--s) * 46);height:calc(var(--s) * 46);}
.card--producao .seta{background:var(--seta-verde);color:var(--foqui-creme);}
.card--finalizacao .seta{background:#f7b0bf;color:var(--foqui-grafite);box-shadow:0 calc(var(--s)*8) calc(var(--s)*18) rgba(0,0,0,.15);}

.texto{
  position:absolute;
  left:0;right:0;
  top:calc(var(--s) * 262);
  text-align:center;
  position:absolute;
}
.texto h2{
  font-family:'Foqui Serif',Georgia,serif;
  font-weight:400;
  font-size:calc(var(--s) * 66);
  line-height:1;
  letter-spacing:-.01em;
  color:var(--foqui-creme);
  text-shadow:0 calc(var(--s)*3) calc(var(--s)*10) rgba(0,0,0,.18);
}
.texto p{
  margin-top:calc(var(--s) * 22);
  font-size:calc(var(--s) * 29);
  line-height:1.5;
  font-weight:400;
}
.card--producao .texto p{color:var(--texto-sec-verde);}
.card--finalizacao .texto p{color:var(--texto-sec-rosa);}
.card--finalizacao .icone svg{width:calc(var(--s) * 156);height:calc(var(--s) * 122);}
</style>
</head>
